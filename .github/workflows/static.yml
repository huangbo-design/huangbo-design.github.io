name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the portfolio source
        uses: actions/checkout@v6
        with:
          repository: nick1210819187/Nick-s-Portfolio.github.io
          ref: main
          path: source
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the published site
        working-directory: source/Huangbo-portfolio-github-lite
        run: |
          mkdir -p "$RUNNER_TEMP/portfolio"
          cp -R assets index.html case.html content.js site.js style.css glass-preview.css glass-preview.js "$RUNNER_TEMP/portfolio/"
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/portfolio
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
